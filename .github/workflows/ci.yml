name: CI
on:
  push:
    branches: [main, 'skills/**']
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
      - run: uv build
  orthanc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: docker compose up -d --wait orthanc
      - run: uv run pytest -q
        env:
          ORTHANC_URL: http://localhost:8042
          ORTHANC_DICOM_PORT: '4242'
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T gateway gateway demo
      - run: |
          for attempt in $(seq 1 30); do
            docker compose exec -T gateway gateway status --state /state > /tmp/status.json
            if python -c 'import json; assert json.load(open("/tmp/status.json"))["counts"].get("delivered") == 4'; then
              cat /tmp/status.json
              exit 0
            fi
            sleep 1
          done
          exit 1
      - if: always()
        run: docker compose down -v --remove-orphans
